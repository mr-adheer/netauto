---
# =============================================================================
# deploy_dhcp_snooping.yaml
#
#   ansible-playbook <playbook>.yaml --tags deploy   -> validate only
#   ansible-playbook <playbook>.yaml --tags deploy   -> deploy only
#   ansible-playbook <playbook>.yaml --tags deploy,validate   -> deploy and then validate
#
# Fully supported by the YANG model, so no CLI fallback is needed for the
# deployment. Validation reads over CLI because "show running-config all"
# is the authority on what is actually on the device.
#
# Note the two separate elements under <dhcp>:
#   <snooping/>       the empty element that enables the feature
#                     ("ip dhcp snooping")
#   <snooping-conf>   the settings - option and vlan-list
#
# NETCONF uses error_option: rollback-on-error, so a failed edit leaves
# nothing behind in the candidate datastore.
#
# After a deploy in the same run, the validation read retries (3 x 10
# seconds), because IOS-XE applies a NETCONF commit in the background.
#
# NOTE: get_filter is required on every NETCONF task. See Cisco bug
# CSCwk31014.
# =============================================================================

- name: Configure and validate DHCP snooping
  hosts: access_switches
  gather_facts: false

  tasks:

    # =========================================================================
    # DEPLOY - skipped unless --tags deploy is given
    # =========================================================================
    - name: DEPLOY - Configure DHCP snooping
      ansible.netcommon.netconf_config:
        content: |
          <config xmlns="urn:ietf:params:xml:ns:netconf:base:1.0">
            <native xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-native">
              <ip>
                <dhcp>
                  <snooping xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-dhcp"/>
                  <snooping-conf xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-dhcp">
                    <snooping>
                      <information>
                        <option>false</option>
                      </information>
                      <vlan-list>
                        <id>{{ dhcp_snooping_vlans }}</id>
                      </vlan-list>
                    </snooping>
                  </snooping-conf>
                </dhcp>
              </ip>
            </native>
          </config>
        get_filter: |
          <filter xmlns="urn:ietf:params:xml:ns:netconf:base:1.0">
            <native xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-native">
              <ip>
                <dhcp/>
              </ip>
            </native>
          </filter>
        target: candidate
        commit: true
        error_option: rollback-on-error
      register: snoop_deploy
      vars:
        ansible_connection: netconf
        ansible_port: 830
      tags: [deploy, never]

    # =========================================================================
    # VALIDATE - runs by default, and after a deploy
    # =========================================================================
    # Retries only when a deploy ran in this run (snoop_deploy is defined).
    - name: VALIDATE - Read the DHCP snooping configuration back, retries after deploy
      cisco.ios.ios_command:
        commands:
          - show running-config all | include ^ip dhcp snooping|^no ip dhcp snooping
      register: snoop_read
      until: >-
        snoop_deploy is not defined
        or (snoop_read is not failed
            and ('ip dhcp snooping vlan ' ~ dhcp_snooping_vlans)
                in (snoop_read.stdout[0] | default('')))
      retries: 3
      delay: 10
      ignore_errors: true
      vars:
        ansible_connection: network_cli
        ansible_port: 22
      changed_when: false
      tags: [validate, always]

    - name: VALIDATE - Store the output as trimmed lines
      set_fact:
        snoop_lines: "{{ (snoop_read.stdout_lines | default([[]]))[0] | map('trim') | list }}"
      tags: [validate, always]

    - name: VALIDATE - Define the expected lines
      set_fact:
        snoop_checks:
          - "ip dhcp snooping"
          - "ip dhcp snooping vlan {{ dhcp_snooping_vlans }}"
          - "no ip dhcp snooping information option"
      tags: [validate, always]

    - name: VALIDATE - Check each line and record the results
      set_fact:
        validation_results: >-
          {{ validation_results | default([]) + [{
               'feature':  'dhcp snooping',
               'check':    item,
               'expected': 'present',
               'actual':   'present' if item in snoop_lines else 'missing',
               'result':   'PASS' if item in snoop_lines else 'FAIL'
             }] }}
      loop: "{{ snoop_checks }}"
      loop_control:
        label: "{{ item }}"
      tags: [validate, always]

    - name: VALIDATE - Show the result
      debug:
        msg: >-
          {{ 'PASS' if snoop_failed | length == 0 else 'FAIL' }}
          ---> dhcp snooping:
          {{ snoop_all | length - snoop_failed | length }}
          of {{ snoop_all | length }} present
          {{ '' if snoop_failed | length == 0
             else '- missing: ' + (snoop_failed | map(attribute='check') | join('; ')) }}
      vars:
        snoop_all: >-
          {{ validation_results
             | selectattr('feature', 'equalto', 'dhcp snooping') | list }}
        snoop_failed: >-
          {{ snoop_all | selectattr('result', 'equalto', 'FAIL') | list }}
      changed_when: snoop_failed | length > 0
      tags: [validate, always]
