---
# =============================================================================
# deploy_dns_domain_name.yaml
#
#   ansible-playbook <playbook>.yaml --tags deploy   -> validate only
#   ansible-playbook <playbook>.yaml --tags deploy   -> deploy only
#   ansible-playbook <playbook>.yaml --tags deploy,validate   -> deploy and then validate
#
# Fully supported by the YANG model, so no CLI fallback is needed for the
# deployment. Validation reads over CLI because "show running-config all"
# is the authority on what is actually on the device.
#
# Note:
#   <lookup>false</lookup>  = "no ip domain lookup"
#   <no-vrf>                = a name server in the global table, one element
#                             per server
#
# NETCONF uses error_option: rollback-on-error, so a failed edit leaves
# nothing behind in the candidate datastore.
#
# After a deploy in the same run, the validation read retries (3 x 10
# seconds), because IOS-XE applies a NETCONF commit in the background.
#
# NOTE: get_filter is required on every NETCONF task. See Cisco bug
# CSCwk31014.
# =============================================================================

- name: Configure and validate DNS
  hosts: all
  gather_facts: false

  tasks:

    # =========================================================================
    # DEPLOY - skipped unless --tags deploy is given
    # =========================================================================
    - name: DEPLOY - Configure DNS servers, domain name and disable lookup
      ansible.netcommon.netconf_config:
        content: |
          <config xmlns="urn:ietf:params:xml:ns:netconf:base:1.0">
            <native xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-native">
              <ip>
                <domain>
                  <lookup>false</lookup>
                  <name>{{ domain_name }}</name>
                </domain>
                <name-server>
                  <no-vrf>{{ dns_server_ip_1 }}</no-vrf>
                  <no-vrf>{{ dns_server_ip_2 }}</no-vrf>
                </name-server>
              </ip>
            </native>
          </config>
        get_filter: |
          <filter xmlns="urn:ietf:params:xml:ns:netconf:base:1.0">
            <native xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-native">
              <ip>
                <domain/>
                <name-server/>
              </ip>
            </native>
          </filter>
        target: candidate
        commit: true
        error_option: rollback-on-error
      register: dns_deploy
      vars:
        ansible_connection: netconf
        ansible_port: 830
      tags: [deploy, never]

    # =========================================================================
    # VALIDATE - runs by default, and after a deploy
    # =========================================================================
    # Retries only when a deploy ran in this run (dns_deploy is defined).
    - name: VALIDATE - Read the DNS configuration back, retries after deploy
      cisco.ios.ios_command:
        commands:
          - show running-config all | include ^ip domain|^no ip domain|^ip name-server
      register: dns_read
      until: >-
        dns_deploy is not defined
        or (dns_read is not failed
            and ('ip domain name ' ~ domain_name) in (dns_read.stdout[0] | default('')))
      retries: 3
      delay: 10
      ignore_errors: true
      vars:
        ansible_connection: network_cli
        ansible_port: 22
      changed_when: false
      tags: [validate, never]

    - name: VALIDATE - Store the output as trimmed lines
      set_fact:
        dns_lines: "{{ (dns_read.stdout_lines | default([[]]))[0] | map('trim') | list }}"
      tags: [validate, never]

    - name: VALIDATE - Define the expected lines
      set_fact:
        dns_checks:
          - "no ip domain lookup"
          - "ip domain name {{ domain_name }}"
      tags: [validate, never]

    - name: VALIDATE - Check each line and record the results
      set_fact:
        validation_results: >-
          {{ validation_results | default([]) + [{
               'feature':  'dns',
               'check':    item,
               'expected': 'present',
               'actual':   'present' if item in dns_lines else 'missing',
               'result':   'PASS' if item in dns_lines else 'FAIL'
             }] }}
      loop: "{{ dns_checks }}"
      loop_control:
        label: "{{ item }}"
      tags: [validate, never]

    # The name servers may be on one line or on separate lines, so each
    # address is looked for as a whole word in the "ip name-server" lines.
    # regex_escape stops the dots acting as wildcards, and the space/end
    # boundary stops 10.1.1.1 from matching 10.1.1.10.
    - name: VALIDATE - Check each name server and record the results
      set_fact:
        validation_results: >-
          {{ validation_results | default([]) + [{
               'feature':  'dns',
               'check':    'name-server ' ~ item,
               'expected': item,
               'actual':   item if found else 'missing',
               'result':   'PASS' if found else 'FAIL'
             }] }}
      vars:
        ns_text: "{{ dns_lines | select('match', '^ip name-server') | join(' ') }}"
        found: "{{ ns_text is search('(^|\\s)' ~ (item | regex_escape) ~ '(\\s|$)') }}"
      loop:
        - "{{ dns_server_ip_1 }}"
        - "{{ dns_server_ip_2 }}"
      loop_control:
        label: "{{ item }}"
      tags: [validate, never]

    - name: VALIDATE - Show the result
      debug:
        msg: >-
          {{ 'PASS' if dns_failed | length == 0 else 'FAIL' }}
          ---> dns:
          {{ dns_all | length - dns_failed | length }}
          of {{ dns_all | length }} present
          {{ '' if dns_failed | length == 0
             else '- missing: ' + (dns_failed | map(attribute='check') | join('; ')) }}
      vars:
        dns_all: >-
          {{ validation_results
             | selectattr('feature', 'equalto', 'dns') | list }}
        dns_failed: >-
          {{ dns_all | selectattr('result', 'equalto', 'FAIL') | list }}
      changed_when: dns_failed | length > 0
      tags: [validate, never]
