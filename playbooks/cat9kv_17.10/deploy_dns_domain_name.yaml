---
# =============================================================================
# deploy_dns_domain_name.yaml
#
#   ansible-playbook deploy_dns_domain_name.yaml                 -> validate only
#   ansible-playbook deploy_dns_domain_name.yaml --tags deploy   -> deploy, then validate
#
# Fully supported by the YANG model, so no CLI fallback is needed for the
# deployment. Validation reads over CLI because "show running-config all"
# is the authority on what is actually on the device.
#
# Note:
#   <lookup>false</lookup>  = "no ip domain lookup"
#   <no-vrf>                = a name server in the global table, one element
#                             per server
#
# NOTE: get_filter is required on every NETCONF task. See Cisco bug
# CSCwk31014.
# =============================================================================

- name: Configure and validate DNS
  hosts: all
  gather_facts: false

  tasks:

    # =========================================================================
    # DEPLOY - skipped unless --tags deploy is given
    # =========================================================================
    - name: Configure DNS servers, domain name and disable lookup
      ansible.netcommon.netconf_config:
        content: |
          <config xmlns="urn:ietf:params:xml:ns:netconf:base:1.0">
            <native xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-native">
              <ip>
                <domain>
                  <lookup>false</lookup>
                  <name>{{ domain_name }}</name>
                </domain>
                <name-server>
                  <no-vrf>{{ dns_server_ip_1 }}</no-vrf>
                  <no-vrf>{{ dns_server_ip_2 }}</no-vrf>
                </name-server>
              </ip>
            </native>
          </config>
        get_filter: |
          <filter xmlns="urn:ietf:params:xml:ns:netconf:base:1.0">
            <native xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-native">
              <ip>
                <domain/>
                <name-server/>
              </ip>
            </native>
          </filter>
        target: candidate
        commit: true
      vars:
        ansible_connection: netconf
        ansible_port: 830
      tags:
        - deploy
        - never

    # =========================================================================
    # VALIDATE - runs by default, and after a deploy
    # =========================================================================
    - name: Read the DNS configuration
      cisco.ios.ios_command:
        commands:
          - show running-config all | include ^ip domain|^no ip domain|^ip name-server
      register: dns_read
      vars:
        ansible_connection: network_cli
        ansible_port: 22
      changed_when: false
      tags:
        - validate
        - always

    - name: Store the output as trimmed lines
      set_fact:
        dns_lines: "{{ dns_read.stdout_lines[0] | map('trim') | list }}"
      tags:
        - validate
        - always

    # The two name servers may render on one line or two depending on
    # platform, so each is checked by looking for the address rather than
    # by exact whole-line match.
    - name: Define what should be present
      set_fact:
        dns_checks:
          - "no ip domain lookup"
          - "ip domain name {{ domain_name }}"
      tags:
        - validate
        - always

    - name: Evaluate the line checks
      set_fact:
        validation_results: >-
          {{ validation_results | default([]) + [{
               'feature':  'dns',
               'check':    item,
               'expected': 'present',
               'actual':   'present' if item in dns_lines else 'missing',
               'result':   'PASS' if item in dns_lines else 'FAIL'
             }] }}
      loop: "{{ dns_checks }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - validate
        - always

    - name: Evaluate the name servers
      set_fact:
        validation_results: >-
          {{ validation_results | default([]) + [{
               'feature':  'dns',
               'check':    'name-server ' ~ item,
               'expected': item,
               'actual':   item if (dns_lines | select('search', 'name-server') | join(' ')) is search(item) else 'missing',
               'result':   'PASS' if (dns_lines | select('search', 'name-server') | join(' ')) is search(item) else 'FAIL'
             }] }}
      loop:
        - "{{ dns_server_ip_1 }}"
        - "{{ dns_server_ip_2 }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - validate
        - always

    - name: Report
      debug:
        msg: >-
          {{ 'PASS' if dns_failed | length == 0 else 'FAIL' }}
          ---> dns:
          {{ 4 - dns_failed | length }} of 4 present
          {{ '' if dns_failed | length == 0
             else '- missing: ' + (dns_failed | map(attribute='check') | join('; ')) }}
      vars:
        dns_failed: >-
          {{ validation_results
             | selectattr('feature', 'equalto', 'dns')
             | selectattr('result', 'equalto', 'FAIL') | list }}
      changed_when: dns_failed | length > 0
      tags:
        - validate
        - always
