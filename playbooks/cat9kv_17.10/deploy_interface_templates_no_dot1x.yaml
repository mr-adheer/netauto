---
# =============================================================================
# deploy_interface_templates_no_dot1x.yaml
#
#   ansible-playbook <playbook>.yaml --tags deploy   -> validate only
#   ansible-playbook <playbook>.yaml --tags deploy   -> deploy only
#   ansible-playbook <playbook>.yaml --tags deploy,validate   -> deploy and then validate
#
#
# NETCONF where the YANG model supports it, CLI where it does not.
# The two original plays are merged into one; each task carries its own
# connection settings.
#
# Two things to note:
#
# 1. storm-control thresholds are DECIMALS in the model ("10.0", not "10").
#    This is how the device stores them.
#
# 2. "spanning-tree guard loop" does NOT appear under any template in the
#    model, even though TRUNK_UPLINK has it in the CLI config. It is
#    deployed over CLI.
#
# VALIDATION
#   Each template is read as its own section, so a line found under one
#   template cannot satisfy a check for another. The expected lines live in
#   group_vars/access_switches/interface_templates.yaml (template_checks),
#   written as the switch prints them, e.g. "storm-control broadcast level
#   10.00". If you change the XML below, update that file too.
#
# NETCONF uses error_option: rollback-on-error, so a failed edit leaves
# nothing behind in the candidate datastore.
#
# WHY SOME TASKS RETRY
#   IOS-XE applies a NETCONF commit in the background and refuses CLI
#   configuration while it does. The loop-guard task (first CLI task after
#   NETCONF) retries 3 x 10 seconds, and the validation read retries too,
#   but only when a deploy ran in this run.
#
# NOTE: get_filter is required on every NETCONF task. See Cisco bug
# CSCwk31014.
# =============================================================================

- name: Configure and validate interface templates
  hosts: access_switches
  gather_facts: false

  tasks:

    # =========================================================================
    # DEPLOY - skipped unless --tags deploy is given
    # =========================================================================
    - name: DEPLOY - Configure the interface templates
      vars:
        ansible_connection: netconf
        ansible_port: 830
      ansible.netcommon.netconf_config:
        content: |
          <config xmlns="urn:ietf:params:xml:ns:netconf:base:1.0">
            <native xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-native">
              <template>

                <template_details xmlns="http://cisco.com/ns/yang/ios-xe/template">
                  <template_name>TRUNK_FLEX_AP</template_name>
                  <switchport>
                    <mode>
                      <trunk/>
                    </mode>
                    <nonegotiate/>
                  </switchport>
                  <storm-control>
                    <broadcast>
                      <level>
                        <threshold>10.0</threshold>
                      </level>
                    </broadcast>
                    <multicast>
                      <level>
                        <threshold>10.0</threshold>
                      </level>
                    </multicast>
                    <action>
                      <trap/>
                    </action>
                  </storm-control>
                </template_details>

                <template_details xmlns="http://cisco.com/ns/yang/ios-xe/template">
                  <template_name>TRUNK_UPLINK</template_name>
                  <switchport>
                    <mode>
                      <trunk/>
                    </mode>
                    <nonegotiate/>
                  </switchport>
                  <storm-control>
                    <broadcast>
                      <level>
                        <threshold>10.0</threshold>
                      </level>
                    </broadcast>
                    <multicast>
                      <level>
                        <threshold>10.0</threshold>
                      </level>
                    </multicast>
                    <action>
                      <trap/>
                    </action>
                  </storm-control>
                  <ip>
                    <dhcp>
                      <snooping>
                        <trust/>
                      </snooping>
                    </dhcp>
                  </ip>
                </template_details>

                <template_details xmlns="http://cisco.com/ns/yang/ios-xe/template">
                  <template_name>ACCESS_PORT</template_name>
                  <switchport>
                    <mode>
                      <access/>
                    </mode>
                    <nonegotiate/>
                    <port-security>
                      <aging>
                        <time>2</time>
                        <type>
                          <inactivity/>
                        </type>
                      </aging>
                      <maximum>
                        <range>
                          <range>3</range>
                        </range>
                      </maximum>
                      <violation>
                        <restrict/>
                      </violation>
                    </port-security>
                  </switchport>
                  <spanning-tree>
                    <bpduguard>
                      <enable/>
                    </bpduguard>
                    <portfast>
                    </portfast>
                  </spanning-tree>
                  <storm-control>
                    <broadcast>
                      <level>
                        <threshold>1.0</threshold>
                      </level>
                    </broadcast>
                    <multicast>
                      <level>
                        <threshold>1.0</threshold>
                      </level>
                    </multicast>
                    <action>
                      <trap/>
                    </action>
                  </storm-control>
                  <load-interval>60</load-interval>
                  <ip>
                    <dhcp>
                      <snooping>
                        <limit>
                          <rate>15</rate>
                        </limit>
                      </snooping>
                    </dhcp>
                  </ip>
                  <device-tracking>
                    <attach-policy>
                      <policy-name>
                        <policy-name>IPDT_POLICY</policy-name>
                      </policy-name>
                    </attach-policy>
                  </device-tracking>
                </template_details>

              </template>
            </native>
          </config>
        get_filter: |
          <filter xmlns="urn:ietf:params:xml:ns:netconf:base:1.0">
            <native xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-native">
              <template/>
            </native>
          </filter>
        target: candidate
        commit: true
        error_option: rollback-on-error
      register: tmpl_deploy
      tags: [deploy, never]

    # "spanning-tree guard loop" does not appear under any template in the
    # YANG model, so it is applied over CLI.
    # First CLI task after the NETCONF commit: retries while the switch
    # finishes applying it.
    - name: DEPLOY - Add loop guard to the uplink template
      vars:
        ansible_connection: network_cli
        ansible_port: 22
      cisco.ios.ios_config:
        lines:
          - spanning-tree guard loop
        parents: template TRUNK_UPLINK
      tags: [deploy, never]
      register: loop_guard
      until: loop_guard is not failed
      retries: 3
      delay: 10

    # =========================================================================
    # VALIDATE - runs by default, and after a deploy
    # =========================================================================
    - name: VALIDATE - Read each template back as its own section
      vars:
        ansible_connection: network_cli
        ansible_port: 22
      cisco.ios.ios_command:
        # Must be in the same order as the templates in template_checks.
        # "$" anchors each name, so TRUNK_UPLINK cannot also match TRUNK_UPLINK2.
        commands:
          - show running-config all | section ^template TRUNK_FLEX_AP$
          - show running-config all | section ^template TRUNK_UPLINK$
          - show running-config all | section ^template ACCESS_PORT$
      register: tmpl_read
      until: >-
        tmpl_deploy is not defined
        or (tmpl_read is not failed
            and (tmpl_read.stdout | default([]) | select | list | length) == 3)
      retries: 3
      delay: 10
      ignore_errors: true
      changed_when: false
      tags: [validate, always]

    - name: VALIDATE - Store each section as trimmed lines
      set_fact:
        tmpl_lines: >-
          {{ tmpl_lines | default({})
             | combine({ item.0: item.1 | map('trim') | list }) }}
      loop: >-
        {{ template_checks.keys() | list
           | zip(tmpl_read.stdout_lines | default([[], [], []])) | list }}
      loop_control:
        label: "{{ item.0 }}"
      tags: [validate, always]

    # item.0.key is the template name, item.1 is one expected line.
    - name: VALIDATE - Check each template and record the results
      set_fact:
        validation_results: >-
          {{ validation_results | default([]) + [{
               'feature':  'interface templates',
               'check':    item.0.key ~ ' / ' ~ item.1,
               'expected': 'present',
               'actual':   'present' if item.1 in (tmpl_lines | default({}))[item.0.key] | default([]) else 'missing',
               'result':   'PASS' if item.1 in (tmpl_lines | default({}))[item.0.key] | default([]) else 'FAIL'
             }] }}
      loop: "{{ template_checks | dict2items | subelements('value') }}"
      loop_control:
        label: "{{ item.0.key }} / {{ item.1 }}"
      tags: [validate, always]

    - name: VALIDATE - Show the result
      debug:
        msg: >-
          {{ 'PASS' if tmpl_failed | length == 0 else 'FAIL' }}
          ---> interface templates:
          {{ tmpl_all | length - tmpl_failed | length }}
          of {{ tmpl_all | length }} present
          {{ '' if tmpl_failed | length == 0
             else '- missing: ' + (tmpl_failed | map(attribute='check') | join('; ')) }}
      vars:
        tmpl_all: >-
          {{ validation_results
             | selectattr('feature', 'equalto', 'interface templates') | list }}
        tmpl_failed: >-
          {{ tmpl_all | selectattr('result', 'equalto', 'FAIL') | list }}
      changed_when: tmpl_failed | length > 0
      tags: [validate, always]
