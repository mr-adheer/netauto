---
# =============================================================================
# deploy_local_aaa.yaml
#
#   ansible-playbook <playbook>.yaml --tags deploy   -> validate only
#   ansible-playbook <playbook>.yaml --tags deploy   -> deploy only
#   ansible-playbook <playbook>.yaml --tags deploy,validate   -> deploy and then validate
#
# AAA, management ACL and line configuration.
# NETCONF where the YANG model supports it, CLI where it does not.
# The two original plays are merged into one; each task carries its own
# connection settings.
#
# CLI fallback is required for:
#   - aaa authentication fail-message  (no YANG element)
#   - aaa login display last-success / last-failure
#     (the YANG <display> leaf holds only ONE value)
#
# NETCONF tasks use error_option: rollback-on-error, so a failed edit leaves
# nothing behind in the candidate datastore.
#
# WHY SOME TASKS RETRY
#   IOS-XE applies a NETCONF commit to the running configuration in the
#   background, and refuses CLI configuration while it does. So the first CLI
#   task after the NETCONF tasks retries (3 x 10 seconds), and the validation
#   read retries too, but only when a deploy ran in this run.
#
# NOTE: run the local credentials playbook BEFORE this one. This playbook
# sets "authentication login default local", which requires the local users
# to already exist.
#
# VALIDATION
#   The line configuration is read as sections ("line con 0", "line vty 0 15")
#   because lines such as "login authentication default" appear under both
#   and a flat search could not tell them apart.
#   The management ACL is read as its own section for the same reason.
#
# NOTE: get_filter is required on every NETCONF task. See Cisco bug
# CSCwk31014.
# =============================================================================

- name: Configure and validate local AAA
  hosts: access_switches
  gather_facts: false

  tasks:

    # =========================================================================
    # DEPLOY - skipped unless --tags deploy is given
    # =========================================================================
    - name: DEPLOY - Configure privilege exec levels
      ansible.netcommon.netconf_config:
        content: |
          <config xmlns="urn:ietf:params:xml:ns:netconf:base:1.0">
            <native xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-native">
              <privilege>
                <mode>
                  <name>exec</name>
                  <level>
                    <privilege>7</privilege>
                    <command-list><command>clear</command></command-list>
                    <command-list><command>clear counters</command></command-list>
                    <command-list><command>copy</command></command-list>
                    <command-list><command>copy running-config</command></command-list>
                    <command-list><command>ping</command></command-list>
                    <command-list><command>ping ip</command></command-list>
                    <command-list><command>show</command></command-list>
                    <command-list><command>show configuration</command></command-list>
                    <command-list><command>show ip</command></command-list>
                    <command-list><command>show ip route</command></command-list>
                    <command-list><command>show logging</command></command-list>
                    <command-list><command>show processes</command></command-list>
                    <command-list><command>show running-config</command></command-list>
                    <command-list><command>traceroute</command></command-list>
                    <command-list><command>verify</command></command-list>
                  </level>
                  <level>
                    <privilege>15</privilege>
                    <command-list><command>configure</command></command-list>
                    <command-list><command>configure terminal</command></command-list>
                  </level>
                </mode>
              </privilege>
            </native>
          </config>
        get_filter: |
          <filter xmlns="urn:ietf:params:xml:ns:netconf:base:1.0">
            <native xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-native">
              <privilege/>
            </native>
          </filter>
        target: candidate
        commit: true
        error_option: rollback-on-error
      vars:
        ansible_connection: netconf
        ansible_port: 830
      tags: [deploy, never]

    - name: DEPLOY - Configure AAA
      ansible.netcommon.netconf_config:
        content: |
          <config xmlns="urn:ietf:params:xml:ns:netconf:base:1.0">
            <native xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-native">
              <aaa>
                <new-model xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-aaa"/>
                <session-id xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-aaa">common</session-id>
                <authentication xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-aaa">
                  <login>
                    <name>default</name>
                    <a1>
                      <local/>
                    </a1>
                  </login>
                  <enable>
                    <default>
                      <enable/>
                    </default>
                  </enable>
                </authentication>
                <authorization xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-aaa">
                  <config-commands/>
                  <console/>
                  <exec>
                    <name>default</name>
                    <a1>
                      <local/>
                    </a1>
                    <a2>
                      <if-authenticated/>
                    </a2>
                  </exec>
                </authorization>
                <accounting xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-aaa">
                  <update>
                    <newinfo>
                      <periodic>2880</periodic>
                    </newinfo>
                  </update>
                </accounting>
                <login xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-aaa">
                  <display>number-failures</display>
                  <success-track-conf-time>0</success-track-conf-time>
                </login>
              </aaa>
            </native>
          </config>
        get_filter: |
          <filter xmlns="urn:ietf:params:xml:ns:netconf:base:1.0">
            <native xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-native">
              <aaa/>
            </native>
          </filter>
        target: candidate
        commit: true
        error_option: rollback-on-error
      vars:
        ansible_connection: netconf
        ansible_port: 830
      tags: [deploy, never]

    - name: DEPLOY - Configure the management ACL
      ansible.netcommon.netconf_config:
        content: |
          <config xmlns="urn:ietf:params:xml:ns:netconf:base:1.0">
            <native xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-native">
              <ip>
                <access-list>
                  <standard xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-acl">
                    <name>MGMT_ACL</name>
                    {% for ace in mgmt_acl_entries %}
                    <access-list-seq-rule>
                      <sequence>{{ ace.sequence }}</sequence>
                      <{{ ace.grant }}>
                        <std-ace>
                          {% if ace.source.any is defined %}
                          <any/>
                          {% else %}
                          <ipv4-address-prefix>{{ ace.source.address }}</ipv4-address-prefix>
                          <mask>{{ ace.source.wildcard_bits }}</mask>
                          {% endif %}
                          <log/>
                        </std-ace>
                      </{{ ace.grant }}>
                    </access-list-seq-rule>
                    {% endfor %}
                  </standard>
                </access-list>
              </ip>
            </native>
          </config>
        get_filter: |
          <filter xmlns="urn:ietf:params:xml:ns:netconf:base:1.0">
            <native xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-native">
              <ip>
                <access-list/>
              </ip>
            </native>
          </filter>
        target: candidate
        commit: true
        error_option: rollback-on-error
      vars:
        ansible_connection: netconf
        ansible_port: 830
      tags: [deploy, never]

    - name: DEPLOY - Configure the console and VTY lines
      ansible.netcommon.netconf_config:
        content: |
          <config xmlns="urn:ietf:params:xml:ns:netconf:base:1.0">
            <native xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-native">
              <line>
                <console>
                  <first>0</first>
                  <exec-timeout>
                    <minutes>5</minutes>
                    <seconds>0</seconds>
                  </exec-timeout>
                  <login>
                    <authentication>default</authentication>
                  </login>
                  <logging>
                    <synchronous/>
                  </logging>
                </console>
                <vty>
                  <first>0</first>
                  <last>15</last>
                  <access-class>
                    <acccess-list>
                      <direction>in</direction>
                      <access-list>MGMT_ACL</access-list>
                      <vrf-also/>
                    </acccess-list>
                  </access-class>
                  <authorization>
                    <exec>
                      <authorization-name>default</authorization-name>
                    </exec>
                  </authorization>
                  <exec-timeout>
                    <minutes>5</minutes>
                    <seconds>0</seconds>
                  </exec-timeout>
                  <login>
                    <authentication>default</authentication>
                  </login>
                  <logging>
                    <synchronous/>
                  </logging>
                  <transport>
                    <output>
                      <none/>
                    </output>
                    <preferred>
                      <protocol>none</protocol>
                    </preferred>
                    <input>
                      <input>ssh</input>
                    </input>
                  </transport>
                </vty>
              </line>
            </native>
          </config>
        get_filter: |
          <filter xmlns="urn:ietf:params:xml:ns:netconf:base:1.0">
            <native xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-native">
              <line/>
            </native>
          </filter>
        target: candidate
        commit: true
        error_option: rollback-on-error
      register: aaa_deploy
      vars:
        ansible_connection: netconf
        ansible_port: 830
      tags: [deploy, never]

    # --- CLI fallback ------------------------------------------------------
    # No YANG element exists for the AAA fail-message.
    # First CLI task after the NETCONF commits: retries while the switch
    # finishes applying them (CLI config is refused during that sync).
    - name: DEPLOY - Configure the AAA fail-message
      cisco.ios.ios_config:
        lines:
          - aaa authentication fail-message  * LOGIN FAILED *
      register: fail_message_deploy
      until: fail_message_deploy is not failed
      retries: 3
      delay: 10
      vars:
        ansible_connection: network_cli
        ansible_port: 22
      tags: [deploy, never]

    # The YANG <display> leaf holds only one value, so the other two settings
    # must be applied over CLI.
    - name: DEPLOY - Configure the remaining aaa login display settings
      cisco.ios.ios_config:
        lines:
          - aaa login display last-success
          - aaa login display last-failure
      vars:
        ansible_connection: network_cli
        ansible_port: 22
      tags: [deploy, never]

    # =========================================================================
    # VALIDATE - runs by default, and after a deploy
    # =========================================================================
    - name: VALIDATE - Read the AAA, privilege, ACL and line sections back, retries after deploy
      cisco.ios.ios_command:
        commands:
          - show running-config all | include ^aaa |^privilege exec
          - show running-config all | section ^ip access-list standard MGMT_ACL
          - show running-config all | section ^line con 0
          - show running-config all | section ^line vty 0 15
      register: aaa_read
      until: >-
        aaa_deploy is not defined
        or (aaa_read is not failed
            and (aaa_read.stdout[3] | default('') | length) > 0)
      retries: 3
      delay: 10
      ignore_errors: true
      vars:
        ansible_connection: network_cli
        ansible_port: 22
      changed_when: false
      tags: [validate, always]

    - name: VALIDATE - Store each section as trimmed lines
      set_fact:
        aaa_lines: "{{ (aaa_read.stdout_lines | default([[], [], [], []]))[0] | map('trim') | list }}"
        acl_lines: "{{ (aaa_read.stdout_lines | default([[], [], [], []]))[1] | map('trim') | list }}"
        con_lines: "{{ (aaa_read.stdout_lines | default([[], [], [], []]))[2] | map('trim') | list }}"
        vty_lines: "{{ (aaa_read.stdout_lines | default([[], [], [], []]))[3] | map('trim') | list }}"
      tags: [validate, always]

    - name: VALIDATE - Define the expected lines
      set_fact:
        aaa_checks:
          # --- global aaa and privilege lines ---
          - { where: "aaa",     line: "aaa new-model" }
          - { where: "aaa",     line: "aaa session-id common" }
          - { where: "aaa",     line: "aaa authentication login default local" }
          - { where: "aaa",     line: "aaa authentication enable default enable" }
          - { where: "aaa",     line: "aaa authorization exec default local if-authenticated" }
          - { where: "aaa",     line: "aaa authorization config-commands" }
          - { where: "aaa",     line: "aaa authorization console" }
          - { where: "aaa",     line: "aaa accounting update newinfo periodic 2880" }
          # Deployed as "* LOGIN FAILED *". IOS stores the delimiters as ^C.
          - { where: "aaa",     line: "aaa authentication fail-message ^C LOGIN FAILED ^C" }
          - { where: "aaa",     line: "aaa login display last-success" }
          - { where: "aaa",     line: "aaa login display last-failure" }
          - { where: "aaa",     line: "aaa login display number-failures" }
          - { where: "aaa",     line: "aaa login success-track-conf-time 0" }
          - { where: "aaa",     line: "privilege exec level 15 configure terminal" }
          - { where: "aaa",     line: "privilege exec level 15 configure" }
          - { where: "aaa",     line: "privilege exec level 7 show running-config" }
          - { where: "aaa",     line: "privilege exec level 7 show" }
          - { where: "aaa",     line: "privilege exec level 7 clear counters" }
          - { where: "aaa",     line: "privilege exec level 7 clear" }
          - { where: "aaa",     line: "privilege exec level 7 copy running-config" }
          - { where: "aaa",     line: "privilege exec level 7 ping" }
          - { where: "aaa",     line: "privilege exec level 7 traceroute" }
          - { where: "aaa",     line: "privilege exec level 7 verify" }
          # --- management ACL ---
          - { where: "mgmt acl", line: "ip access-list standard MGMT_ACL" }
          # --- console line ---
          - { where: "line con 0", line: "exec-timeout 5 0" }
          - { where: "line con 0", line: "login authentication default" }
          - { where: "line con 0", line: "logging synchronous" }
          # --- vty lines ---
          - { where: "line vty 0 15", line: "access-class MGMT_ACL in vrf-also" }
          - { where: "line vty 0 15", line: "authorization exec default" }
          - { where: "line vty 0 15", line: "exec-timeout 5 0" }
          - { where: "line vty 0 15", line: "login authentication default" }
          - { where: "line vty 0 15", line: "logging synchronous" }
          - { where: "line vty 0 15", line: "transport input ssh" }
          - { where: "line vty 0 15", line: "transport output none" }
          - { where: "line vty 0 15", line: "transport preferred none" }
      tags: [validate, always]

    - name: VALIDATE - Check each line and record the results
      set_fact:
        validation_results: >-
          {{ validation_results | default([]) + [{
               'feature':  'local aaa',
               'check':    item.where ~ ' / ' ~ item.line,
               'expected': 'present',
               'actual':   'present' if item.line in haystack else 'missing',
               'result':   'PASS' if item.line in haystack else 'FAIL'
             }] }}
      vars:
        haystack: >-
          {{ aaa_lines if item.where == 'aaa'
             else acl_lines if item.where == 'mgmt acl'
             else con_lines if item.where == 'line con 0'
             else vty_lines }}
      loop: "{{ aaa_checks }}"
      loop_control:
        label: "{{ item.where }} / {{ item.line }}"
      tags: [validate, always]

    - name: VALIDATE - Show the result
      debug:
        msg: >-
          {{ 'PASS' if aaa_failed | length == 0 else 'FAIL' }}
          ---> local aaa:
          {{ aaa_checks | length - aaa_failed | length }}
          of {{ aaa_checks | length }} present
          {{ '' if aaa_failed | length == 0
             else '- missing: ' + (aaa_failed | map(attribute='check') | join('; ')) }}
      vars:
        aaa_failed: >-
          {{ validation_results
             | selectattr('feature', 'equalto', 'local aaa')
             | selectattr('result', 'equalto', 'FAIL') | list }}
      changed_when: aaa_failed | length > 0
      tags: [validate, always]
