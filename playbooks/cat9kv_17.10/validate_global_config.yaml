---
# =============================================================
# Validate global configuration
#
# Mirrors deploy_globalconfig.yaml. Run it after deployment.
#
# WHY "show running-config all":
#   Plain "show running-config" omits anything at its default
#   value. A setting such as "no service pad" is correct AND
#   invisible, so searching for it always fails.
#   "all" prints every setting explicitly, so the line is there
#   to find.
#
# WHY EXACT LINE MATCHING, NOT SUBSTRING:
#   "service pad" is a substring of "no service pad". A
#   substring test passes when the setting is wrong. Every
#   assertion below compares against a list of trimmed lines.
#
# WHERE "EXPECTED" COMES FROM:
#   The same variables the deployment used. Never a separate
#   list of expected values - those drift.
# =============================================================

- name: Validate global configuration
  hosts: all
  gather_facts: false
  vars:
    ansible_connection: network_cli
    ansible_port: 22
    # "show run all" is large. Raise the timeout if the read
    # fails on a slow device.
    ansible_command_timeout: 120

  tasks:

    - name: Read the full running configuration
      cisco.ios.ios_command:
        commands:
          - show running-config all
      register: runcfg
      changed_when: false

    - name: Store it as a list of trimmed lines
      set_fact:
        cfg: "{{ runcfg.stdout_lines[0] | map('trim') | list }}"

    - name: Report how many lines were read
      debug:
        msg: "Read {{ cfg | length }} configuration lines"

    # ---------------------------------------------------------
    # Static lines - the value never varies.
    # With "show run all" the "no ..." forms appear explicitly,
    # so they can be checked directly.
    # ---------------------------------------------------------
    - name: Assert static global settings
      assert:
        that:
          - item in cfg
        fail_msg: "MISSING: {{ item }}"
        success_msg: "OK: {{ item }}"
        quiet: true
      loop:
        - service password-encryption
        - service tcp-keepalives-in
        - service tcp-keepalives-out
        - service sequence-numbers
        - service nagle
        - service compress-config
        - service call-home
        - no ip finger
        - no service config
        - no service pad
        - no ip source-route
        - no service internal
        - ip options drop
        - software auto-upgrade enable
      loop_control:
        label: "{{ item }}"

    # ---------------------------------------------------------
    # Lines built from variables - the value comes from YAML,
    # exactly as it did at deployment time
    # ---------------------------------------------------------
    - name: Assert variable-driven settings
      assert:
        that:
          - item in cfg
        fail_msg: "MISSING or WRONG VALUE: {{ item }}"
        success_msg: "OK: {{ item }}"
        quiet: true
      loop:
        - "memory free low-watermark processor {{ memory_low_watermark_processor }}"
        - "memory reserve critical {{ memory_reserved_critical }}"
        - "clock timezone {{ timezone_name }} {{ timezone_hours }} {{ timezone_minutes }}"
        - "ip tcp synwait-time {{ tcp_synwait_time }}"
        - "ip icmp rate-limit unreachable {{ icmp_unreachable_rate_limit }}"
        - "exception crashinfo maximum files {{ crashinfo_max_files }}"
      loop_control:
        label: "{{ item }}"

    # ---------------------------------------------------------
    # Things that must not be enabled.
    # With "show run all" these should appear in their "no"
    # form, so checking the positive form is absent is a second,
    # independent check.
    # ---------------------------------------------------------
    - name: Assert insecure services are not enabled
      assert:
        that:
          - item not in cfg
        fail_msg: "ENABLED BUT SHOULD NOT BE: {{ item }}"
        success_msg: "OK: {{ item }} not enabled"
        quiet: true
      loop:
        - ip http server
        - service pad
        - service internal
        - ip finger
      loop_control:
        label: "{{ item }}"
