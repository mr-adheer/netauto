---
# =============================================================================
# gather.yaml
#
# Runs first in combined_playbook.yaml, only with --tags validate.
# Sets up what report.yaml needs at the end of the run:
#
#   run_ts / run_human   one timestamp for the whole run (report folder name)
#   dev_facts            parsed "show version" - model, serial, version,
#                        uptime (shown at the top of each device report)
#   validation_results   an empty list; every deploy playbook adds its
#                        PASS/FAIL checks to it
#
# Each deploy playbook reads the configuration it needs for itself, so
# nothing else is read here.
# =============================================================================

- name: Gather device state
  hosts: all
  gather_facts: false
  vars:
    ansible_connection: network_cli
    ansible_port: 22

  tasks:

    - name: Set one timestamp for the whole run
      set_fact:
        run_ts: "{{ lookup('pipe', 'date -u +%Y-%m-%d_%H%M%S') }}"
        run_human: "{{ lookup('pipe', 'date -u +%Y-%m-%d\\ %H:%M:%S\\ UTC') }}"
      run_once: true
      delegate_to: localhost
      tags: [validate, never]

    - name: Parse show version
      ansible.utils.cli_parse:
        command: show version
        parser:
          name: ansible.netcommon.pyats
      register: showver
      changed_when: false
      tags: [validate, never]

    - name: Store the device facts and start an empty results list
      set_fact:
        dev_facts: "{{ showver.parsed.version }}"
        validation_results: []
      tags: [validate, never]

    - name: Device
      debug:
        msg: >-
          {{ inventory_hostname }} ({{ ansible_host }})
          {{ dev_facts.chassis }} sn:{{ dev_facts.chassis_sn }}
          {{ dev_facts.version }}
      tags: [validate, never]
