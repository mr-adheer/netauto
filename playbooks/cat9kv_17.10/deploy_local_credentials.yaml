---
# =============================================================================
# deploy_local_credentials.yaml
#
#   ansible-playbook <playbook>.yaml --tags deploy   -> validate only
#   ansible-playbook <playbook>.yaml --tags deploy   -> deploy only
#   ansible-playbook <playbook>.yaml --tags deploy,validate   -> deploy and then validate
#   Users and the enable secret are only created if absent - existing passwords are left alone.
#
#   ansible-playbook deploy_local_credentials.yaml --tags deploy -e rotate_passwords=true
#       -> deploy and re-apply all passwords from the vault. Each new password
#          must differ from the current one by at least 4 characters, or the
#          policy rejects it.
#
# Local credentials and password policy.
# NETCONF where the YANG model supports it, CLI where it does not.
#
# CLI is required for:
#   - usernames with common-criteria-policy      (omitted by the YANG model)
#   - enable secret with common-criteria-policy  (same limitation)
#
# NETCONF tasks use error_option: rollback-on-error, so a failed edit leaves
# nothing behind in the candidate datastore.
#
# NOTE: run this BEFORE the AAA playbook. The AAA playbook sets
# "authentication login default local", which needs these users to exist.
#
# -----------------------------------------------------------------------------
# WHY THE CLI TASKS RETRY
#
#   IOS-XE applies a NETCONF commit to the running configuration in the
#   background. While that sync is running, CLI configuration is refused and
#   the session lands in exec mode, so the next CLI line fails with
#   "% Invalid input detected" on its first character.
#
#   The NETCONF tasks below commit immediately before the CLI tasks, so each
#   CLI task retries for up to 30 seconds to let the sync finish. The
#   validation read also retries, but only when a deploy ran in this run.
#
# WHY USERS ARE ONLY SET WHEN ABSENT
#
#   The policy's "char-changes 4" rejects re-applying an unchanged password,
#   so setting the users on every run would fail from the second run onward.
#   A baseline should not rotate passwords anyway. Use rotate_passwords=true
#   to change them deliberately.
#
# VALIDATION
#   Passwords are not validated - they are stored as one-way hashes. What is
#   checked: login settings, the password policy, that each user exists at the
#   right privilege with the policy attached, and that no unapproved usernames
#   are present.
#
#   Approved usernames: the two created here, the account Ansible connects
#   with (ansible_user), and the optional extra_approved_usernames list.
#
#   Tasks that handle raw output use no_log, because it contains hashes.
#   no_log does NOT hide a module's own error message - a failed CLI task may
#   still print the password. Keep log_path off when testing credentials.
#
# NOTE: get_filter is required on every NETCONF task. See Cisco bug
# CSCwk31014.
# =============================================================================

- name: Configure and validate local credentials
  hosts: access_switches
  gather_facts: false

  tasks:

    # =========================================================================
    # DEPLOY - skipped unless --tags deploy is given
    # =========================================================================
    - name: DEPLOY - Configure login restrictions
      ansible.netcommon.netconf_config:
        content: |
          <config xmlns="urn:ietf:params:xml:ns:netconf:base:1.0">
            <native xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-native">
              <login>
                <delay>3</delay>
                <on-failure>
                  <log>
                  </log>
                </on-failure>
                <on-success>
                  <log>
                  </log>
                </on-success>
                <block-config>
                  <block-for>120</block-for>
                  <attempts>3</attempts>
                  <within>30</within>
                </block-config>
              </login>
            </native>
          </config>
        get_filter: |
          <filter xmlns="urn:ietf:params:xml:ns:netconf:base:1.0">
            <native xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-native">
              <login/>
            </native>
          </filter>
        target: candidate
        commit: true
        error_option: rollback-on-error
      vars:
        ansible_connection: netconf
        ansible_port: 830
      tags: [deploy, never]

    - name: DEPLOY - Configure AES password encryption
      ansible.netcommon.netconf_config:
        content: |
          <config xmlns="urn:ietf:params:xml:ns:netconf:base:1.0">
            <native xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-native">
              <password>
                <encryption>
                  <aes/>
                </encryption>
              </password>
            </native>
          </config>
        get_filter: |
          <filter xmlns="urn:ietf:params:xml:ns:netconf:base:1.0">
            <native xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-native">
              <password/>
            </native>
          </filter>
        target: candidate
        commit: true
        error_option: rollback-on-error
      vars:
        ansible_connection: netconf
        ansible_port: 830
      tags: [deploy, never]

    - name: DEPLOY - Configure the common-criteria password policy
      ansible.netcommon.netconf_config:
        content: |
          <config xmlns="urn:ietf:params:xml:ns:netconf:base:1.0">
            <native xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-native">
              <aaa>
                <common-criteria xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-aaa">
                  <policy>PASSWORD_POLICY</policy>
                  <min-length>8</min-length>
                  <max-length>64</max-length>
                  <numeric-count>1</numeric-count>
                  <upper-case>1</upper-case>
                  <lower-case>1</lower-case>
                  <special-case>1</special-case>
                  <char-changes>4</char-changes>
                </common-criteria>
              </aaa>
            </native>
          </config>
        get_filter: |
          <filter xmlns="urn:ietf:params:xml:ns:netconf:base:1.0">
            <native xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-native">
              <aaa/>
            </native>
          </filter>
        target: candidate
        commit: true
        error_option: rollback-on-error
      register: cred_deploy
      vars:
        ansible_connection: netconf
        ansible_port: 830
      tags: [deploy, never]

    # --- CLI: users and enable secret --------------------------------------
    - name: DEPLOY - Read the existing usernames and enable secret
      cisco.ios.ios_command:
        commands:
          - show running-config | include ^username|^enable
      register: existing_users
      vars:
        ansible_connection: network_cli
        ansible_port: 22
      changed_when: false
      no_log: true
      tags: [deploy, never]

    - name: DEPLOY - Create the privilege 15 user if absent
      cisco.ios.ios_config:
        lines:
          - "username {{ local_username_15 }} privilege 15 common-criteria-policy PASSWORD_POLICY algorithm-type scrypt secret {{ local_secret_15 }}"
      register: user15_result
      until: user15_result is not failed
      retries: 3
      delay: 10
      when: >-
        (rotate_passwords | default(false) | bool)
        or (("username " ~ local_username_15 ~ " ") not in existing_users.stdout[0])
      vars:
        ansible_connection: network_cli
        ansible_port: 22
      no_log: true
      tags: [deploy, never]

    - name: DEPLOY - Create the privilege 7 user if absent
      cisco.ios.ios_config:
        lines:
          - "username {{ local_username_7 }} privilege 7 common-criteria-policy PASSWORD_POLICY algorithm-type scrypt secret {{ local_secret_7 }}"
      register: user7_result
      until: user7_result is not failed
      retries: 3
      delay: 10
      when: >-
        (rotate_passwords | default(false) | bool)
        or (("username " ~ local_username_7 ~ " ") not in existing_users.stdout[0])
      vars:
        ansible_connection: network_cli
        ansible_port: 22
      no_log: true
      tags: [deploy, never]

    - name: DEPLOY - Set the enable secret if absent
      cisco.ios.ios_config:
        lines:
          - "enable common-criteria-policy PASSWORD_POLICY algorithm-type scrypt secret level 15 {{ enable_secret }}"
      register: enable_result
      until: enable_result is not failed
      retries: 3
      delay: 10
      when: >-
        (rotate_passwords | default(false) | bool)
        or ((existing_users.stdout_lines[0] | select('match', '^enable ') | list | length) == 0)
      vars:
        ansible_connection: network_cli
        ansible_port: 22
      no_log: true
      tags: [deploy, never]

    # =========================================================================
    # VALIDATE - runs by default, and after a deploy
    # =========================================================================
    # Retries only when a deploy ran in this run (cred_deploy is defined),
    # to give the NETCONF commit time to reach the running configuration.
    - name: VALIDATE - Read the credential configuration back, retries after deploy
      cisco.ios.ios_command:
        commands:
          - show running-config all | include ^login |^password encryption|^username
          - show running-config all | section ^aaa common-criteria policy PASSWORD_POLICY
      register: cred_read
      until: >-
        cred_deploy is not defined
        or (cred_read is not failed
            and (cred_read.stdout[1] | default('') | length) > 0)
      retries: 3
      delay: 10
      ignore_errors: true
      vars:
        ansible_connection: network_cli
        ansible_port: 22
      changed_when: false
      no_log: true
      tags: [validate, never]

    - name: VALIDATE - Store the output as trimmed lines
      set_fact:
        cred_lines: "{{ (cred_read.stdout_lines | default([[], []]))[0] | map('trim') | list }}"
        policy_lines: "{{ (cred_read.stdout_lines | default([[], []]))[1] | map('trim') | list }}"
      no_log: true
      tags: [validate, never]

    # mode: exact   the whole line must match
    # mode: prefix  the line must START with this text - used for user lines,
    #               which end in a per-device hash
    - name: VALIDATE - Define the expected lines
      set_fact:
        cred_checks:
          # --- login behaviour ---
          - { where: "global", mode: "exact",  line: "login block-for 120 attempts 3 within 30" }
          - { where: "global", mode: "exact",  line: "login delay 3" }
          - { where: "global", mode: "prefix", line: "login on-failure log" }
          - { where: "global", mode: "prefix", line: "login on-success log" }
          - { where: "global", mode: "exact",  line: "password encryption aes" }
          # --- users: existence, privilege level and policy attached ---
          - { where: "global", mode: "prefix", line: "username {{ local_username_15 }} privilege 15 common-criteria-policy PASSWORD_POLICY" }
          - { where: "global", mode: "prefix", line: "username {{ local_username_7 }} privilege 7 common-criteria-policy PASSWORD_POLICY" }
          # --- password policy block ---
          - { where: "policy", mode: "exact",  line: "aaa common-criteria policy PASSWORD_POLICY" }
          - { where: "policy", mode: "exact",  line: "min-length 8" }
          - { where: "policy", mode: "exact",  line: "max-length 64" }
          - { where: "policy", mode: "exact",  line: "numeric-count 1" }
          - { where: "policy", mode: "exact",  line: "upper-case 1" }
          - { where: "policy", mode: "exact",  line: "lower-case 1" }
          - { where: "policy", mode: "exact",  line: "special-case 1" }
          - { where: "policy", mode: "exact",  line: "char-changes 4" }
      tags: [validate, never]

    # Results only ever say present or missing - no hash reaches the report.
    - name: VALIDATE - Check each line and record the results
      set_fact:
        validation_results: >-
          {{ validation_results | default([]) + [{
               'feature':  'local credentials',
               'check':    (item.where ~ ' / ' ~ item.line | trim),
               'expected': 'present',
               'actual':   'present' if hit else 'missing',
               'result':   'PASS' if hit else 'FAIL'
             }] }}
      vars:
        haystack: "{{ policy_lines if item.where == 'policy' else cred_lines }}"
        hit: >-
          {{ (item.line in haystack) if item.mode == 'exact'
             else ((haystack | select('match', '^' ~ (item.line | regex_escape))
                    | list | length) > 0) }}
      loop: "{{ cred_checks }}"
      loop_control:
        label: "{{ item.where }} / {{ item.line | truncate(48) }}"
      no_log: true
      tags: [validate, never]

    # --- unapproved usernames ----------------------------------------------
    - name: VALIDATE - Work out which usernames are approved
      set_fact:
        approved_users: >-
          {{ ([local_username_15, local_username_7, ansible_user]
              + (extra_approved_usernames | default([])))
             | unique | list }}
      tags: [validate, never]

    - name: VALIDATE - Extract the usernames found on the switch
      set_fact:
        found_users: >-
          {{ cred_lines | select('match', '^username ')
             | map('regex_replace', '^username (\\S+).*$', '\\1')
             | unique | list }}
      no_log: true
      tags: [validate, never]

    - name: VALIDATE - Identify unapproved usernames
      set_fact:
        unapproved_users: "{{ found_users | difference(approved_users) }}"
      tags: [validate, never]

    - name: VALIDATE - Record the results, no unapproved usernames
      set_fact:
        validation_results: >-
          {{ validation_results | default([]) + [{
               'feature':  'local credentials',
               'check':    'no unapproved usernames',
               'expected': 'only: ' ~ (approved_users | join(', ')),
               'actual':   'found: ' ~ (found_users | join(', ')),
               'result':   'PASS'
             }] }}
      when: unapproved_users | length == 0
      tags: [validate, never]

    - name: VALIDATE - Record the results, each unapproved username
      set_fact:
        validation_results: >-
          {{ validation_results | default([]) + [{
               'feature':  'local credentials',
               'check':    'unapproved username: ' ~ item,
               'expected': 'not present',
               'actual':   'present',
               'result':   'FAIL'
             }] }}
      loop: "{{ unapproved_users }}"
      loop_control:
        label: "{{ item }}"
      tags: [validate, never]

    - name: VALIDATE - Show the result
      debug:
        msg: >-
          {{ 'PASS' if cred_failed | length == 0 else 'FAIL' }}
          ---> local credentials:
          {{ cred_all | length - cred_failed | length }}
          of {{ cred_all | length }} present
          {{ '' if cred_failed | length == 0
             else '- ' + (cred_failed | map(attribute='check') | join('; ')) }}
      vars:
        cred_all: >-
          {{ validation_results
             | selectattr('feature', 'equalto', 'local credentials') | list }}
        cred_failed: >-
          {{ cred_all | selectattr('result', 'equalto', 'FAIL') | list }}
      changed_when: cred_failed | length > 0
      tags: [validate, never]
