---
# =============================================================
# Local credentials and password policy
# NETCONF where the YANG model supports it, CLI where it does not.
#
# CLI fallback is required for:
#   - key config-key password-encryption  (no YANG element)
#   - usernames with common-criteria-policy  (omitted by the model)
#   - enable secret with common-criteria-policy  (same limitation)
#
# NOTE: this playbook must run BEFORE the AAA playbook. The AAA
# playbook sets "authentication login default local", which needs
# these users to already exist.
# =============================================================

# -------------------------------------------------------------
# PLAY 1 - NETCONF
# -------------------------------------------------------------
- name: Configure local credentials (NETCONF)
  hosts: access_switches
  vars:
    ansible_connection: netconf
    ansible_port: 830
  gather_facts: false

  tasks:

    - name: Configure login restrictions
      ansible.netcommon.netconf_config:
        content: |
          <config xmlns="urn:ietf:params:xml:ns:netconf:base:1.0">
            <native xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-native">
                <login>
                    <delay>3</delay>
                    <on-failure>
                        <log>
                        </log>
                    </on-failure>
                    <on-success>
                        <log>
                        </log>
                    </on-success>
                    <block-config>
                        <block-for>120</block-for>
                        <attempts>3</attempts>
                        <within>30</within>
                    </block-config>
                </login>
            </native>
          </config>
        get_filter: |
          <filter xmlns="urn:ietf:params:xml:ns:netconf:base:1.0">
            <native xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-native">
              <login/>
            </native>
          </filter>
        target: candidate
        commit: true
        lock: never
        error_option: stop-on-error

    - name: Configure AES password encryption
      ansible.netcommon.netconf_config:
        content: |
          <config xmlns="urn:ietf:params:xml:ns:netconf:base:1.0">
            <native xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-native">
              <password>
                <encryption>
                  <aes/>
                </encryption>
              </password>
            </native>
          </config>
        get_filter: |
          <filter xmlns="urn:ietf:params:xml:ns:netconf:base:1.0">
            <native xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-native">
              <password/>
            </native>
          </filter>
        target: candidate
        commit: true
        lock: never
        error_option: stop-on-error

    - name: Configure common-criteria password policy
      ansible.netcommon.netconf_config:
        content: |
          <config xmlns="urn:ietf:params:xml:ns:netconf:base:1.0">
            <native xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-native">
              <aaa>
                <common-criteria xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-aaa">
                  <policy>PASSWORD_POLICY</policy>
                  <min-length>8</min-length>
                  <max-length>64</max-length>
                  <numeric-count>1</numeric-count>
                  <upper-case>1</upper-case>
                  <lower-case>1</lower-case>
                  <special-case>1</special-case>
                  <char-changes>4</char-changes>
                </common-criteria>
              </aaa>
            </native>
          </config>
        get_filter: |
          <filter xmlns="urn:ietf:params:xml:ns:netconf:base:1.0">
            <native xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-native">
              <aaa/>
            </native>
          </filter>
        target: candidate
        commit: true
        lock: never
        error_option: stop-on-error

# -------------------------------------------------------------
# PLAY 2 - CLI fallback
# -------------------------------------------------------------
- name: Configure local credentials (CLI fallback)
  hosts: access_switches
  vars:
    ansible_connection: network_cli
    ansible_port: 22
  gather_facts: false

  tasks:

    # Usernames carrying a common-criteria policy do not appear in
    # the YANG model at all, so they must be configured over CLI.
    - name: Configure local users
      cisco.ios.ios_config:
        lines:
          - "username {{ local_username_15 }} privilege 15 common-criteria-policy PASSWORD_POLICY algorithm-type scrypt secret {{ local_secret_15 }}"
          - "username {{ local_username_7 }} privilege 7 common-criteria-policy PASSWORD_POLICY algorithm-type scrypt secret {{ local_secret_7 }}"
      no_log: true

    # Same limitation applies to the enable secret.
    - name: Configure enable secret
      cisco.ios.ios_config:
        lines:
          - "enable common-criteria-policy PASSWORD_POLICY algorithm-type scrypt secret level 15 {{ enable_secret }}"
      no_log: true
