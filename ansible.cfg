# netauto-repo/ansible.cfg
# Ansible uses this file only when it is found first (ANSIBLE_CONFIG env var,
# then ./ansible.cfg, then ~/.ansible.cfg, then /etc/ansible/ansible.cfg).
# Run playbooks from the repo root so this file is picked up.
# If Ansible warns that the directory is world-writable, it ignores this file:
# fix it with "chmod 755 netauto-repo" or set ANSIBLE_CONFIG=./ansible.cfg

[defaults]

# Don't ask to accept SSH host keys for new or rebuilt switches.
# Fine for a lab or a fresh build; turn it on in production if you keep known_hosts.
host_key_checking = False

# How long (in seconds) Ansible waits for an initial SSH connection to establish
timeout = 5

# Hides the message "this will be removed in a future version" warnings to keep the output clean.
# Set it to True after upgrading Ansible or a collection, to see what needs changing.
deprecation_warnings = False

# Show task results as readable YAML instead of one long JSON line.
# This replaces the old yaml callbacks below, which were removed from
# community.general and now cause errors if enabled.
result_format = yaml


# Don't print tasks that were skipped (e.g. deploy tasks on a validate-only run,
# or "when:" conditions that were false). Keeps the output short.
display_skipped_hosts = False

# Still print tasks that succeeded (green "ok"), so you can see every check that ran.
display_ok_hosts = True

# Add a timing summary at the end of each run, showing the slowest tasks.
# Useful for spotting NETCONF or retry delays.
callbacks_enabled = profile_tasks

# Don't print the playbook file path and line number when a task fails.
# Set it to True when you need to find which line in which file failed.
show_task_path_on_failure = False


[persistent_connection]
# These settings apply to network_cli (SSH) and netconf connections, which stay
# open for the whole play instead of reconnecting for each task.

# How long (in seconds) the persistent connection waits for a command to finish executing.
# Kept high for slow commands such as "show running-config all" and NETCONF commits.
command_timeout = 180

# How long (in seconds) Ansible waits to establish the initial persistent socket handshake
connect_timeout = 60

# How many seconds to wait before retrying a failed persistent connection attempt
connect_retry_timeout = 60
