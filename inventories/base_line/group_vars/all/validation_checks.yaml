# =============================================================================
# validation_checks.yaml
#
# Place in: inventories/<customer>/group_vars/all/
#
# Every check is one line of "show running-config all", with the same
# variables the deploy playbooks used. Nothing here holds a value -
# values come from the customer's own group_vars and host_vars at run time,
# so the same file works at every site.
#
#   state: present   the line must appear
#   state: absent    the line must NOT appear
#   section:         OPTIONAL. The section the line must sit in.
#                    Without it the line is matched anywhere in the config.
#                    With it the line must appear under that exact section
#                    path, so "logging enable" under "archive / log config"
#                    cannot be satisfied by a "logging enable" elsewhere.
#
# Section paths are built from indentation, joined with " / ":
#   archive
#    log config          ->  section: "archive"
#     logging enable     ->  section: "archive"
#
# Matching is whole-line and exact. "service pad" will not match
# "no service pad".
#
# Derived from the deploy playbooks. When you add a line to a playbook,
# add it here.
# =============================================================================

validation_checks:

  # ---------------------------------------------------------------------------
  # deploy_hostname.yaml
  # ---------------------------------------------------------------------------
  - { feature: hostname, state: present, line: "hostname {{ hostname }}" }

  # ---------------------------------------------------------------------------
  # deploy_globalconfig.yaml
  # ---------------------------------------------------------------------------
  - { feature: global, state: present, line: "service password-encryption" }
  - { feature: global, state: present, line: "service timestamps debug datetime msec localtime show-timezone" }
  - { feature: global, state: present, line: "service call-home" }
  - { feature: global, state: present, line: "service compress-config" }
  - { feature: global, state: present, line: "service counters max age 5" }
  - { feature: global, state: present, line: "service nagle" }
  - { feature: global, state: present, line: "service sequence-numbers" }
  - { feature: global, state: present, line: "service tcp-keepalives-in" }
  - { feature: global, state: present, line: "service tcp-keepalives-out" }
  - { feature: global, state: present, line: "no service dhcp" }
  - { feature: global, state: present, line: "no ip finger" }
  - { feature: global, state: present, line: "no service config" }
  - { feature: global, state: present, line: "no service pad" }
  - { feature: global, state: present, line: "no service internal" }
  - { feature: global, state: present, line: "no ip source-route" }
  - { feature: global, state: present, line: "ip options drop" }
  - { feature: global, state: present, line: "software auto-upgrade enable" }
  - { feature: global, state: present, line: "memory free low-watermark processor {{ memory_low_watermark_processor }}" }
  - { feature: global, state: present, line: "memory reserve critical {{ memory_reserved_critical }}" }
  - { feature: global, state: present, line: "clock timezone {{ timezone_name }} {{ timezone_hours }} {{ timezone_minutes }}" }
  - { feature: global, state: present, line: "ip tcp synwait-time {{ tcp_synwait_time }}" }
  - { feature: global, state: present, line: "ip icmp rate-limit unreachable {{ icmp_unreachable_rate_limit }}" }
  - { feature: global, state: present, line: "mac address-table aging-time {{ mac_aging_time }}" }
  - { feature: global, state: present, line: "boot system {{ boot_system_image }}" }
  - { feature: global, state: absent,  line: "service pad" }
  - { feature: global, state: absent,  line: "ip finger" }
  - { feature: global, state: absent,  line: "service internal" }
  # NOT CHECKED - accepted by the parser but never appears in
  # "show running-config all" on Catalyst 9000:
  #   no service tcp-small-servers
  #   no service udp-small-servers
  #   no ntp allow mode control

  # ---------------------------------------------------------------------------
  # deploy_local_credentials.yaml
  # The secrets themselves are not checked - they are hashed on the device
  # and the plaintext never appears. Only presence of the user is checked.
  # ---------------------------------------------------------------------------
  - { feature: credentials, state: present, line: "login block-for 120 attempts 3 within 30" }
  - { feature: credentials, state: present, line: "login delay 3" }
  - { feature: credentials, state: present, line: "login on-failure log every 1" }
  - { feature: credentials, state: present, line: "login on-success log every 1" }
  - { feature: credentials, state: present, line: "password encryption aes" }
  - { feature: credentials, state: present, line: "aaa common-criteria policy PASSWORD_POLICY" }
  - { feature: credentials, state: present, section: "aaa common-criteria policy PASSWORD_POLICY", line: "min-length 8" }
  - { feature: credentials, state: present, section: "aaa common-criteria policy PASSWORD_POLICY", line: "max-length 64" }
  - { feature: credentials, state: present, section: "aaa common-criteria policy PASSWORD_POLICY", line: "numeric-count 1" }
  - { feature: credentials, state: present, section: "aaa common-criteria policy PASSWORD_POLICY", line: "upper-case 1" }
  - { feature: credentials, state: present, section: "aaa common-criteria policy PASSWORD_POLICY", line: "lower-case 1" }
  - { feature: credentials, state: present, section: "aaa common-criteria policy PASSWORD_POLICY", line: "special-case 1" }
  - { feature: credentials, state: present, section: "aaa common-criteria policy PASSWORD_POLICY", line: "char-changes 4" }

  # ---------------------------------------------------------------------------
  # deploy_local_aaa.yaml
  # ---------------------------------------------------------------------------
  - { feature: aaa, state: present, line: "aaa new-model" }
  - { feature: aaa, state: present, line: "aaa session-id common" }
  - { feature: aaa, state: present, line: "aaa authentication login default local" }
  - { feature: aaa, state: present, line: "aaa authorization exec default local if-authenticated" }
  - { feature: aaa, state: present, line: "aaa authentication enable default enable" }
  - { feature: aaa, state: present, line: "aaa authorization config-commands" }
  - { feature: aaa, state: present, line: "aaa authorization console" }
  - { feature: aaa, state: present, line: "aaa accounting update newinfo periodic 2880" }
  - { feature: aaa, state: present, line: "aaa login display number-failures" }
  - { feature: aaa, state: present, line: "aaa login success-track-conf-time 0" }
  - { feature: aaa, state: present, line: "privilege exec level 15 configure terminal" }
  - { feature: aaa, state: present, line: "privilege exec level 7 show running-config" }
  - { feature: aaa, state: present, line: "privilege exec level 7 clear counters" }
  - { feature: aaa, state: present, line: "privilege exec level 7 copy running-config" }
  - { feature: aaa, state: present, line: "privilege exec level 7 traceroute" }
  - { feature: aaa, state: present, line: "privilege exec level 7 verify" }
  - { feature: aaa, state: present, line: "ip access-list standard MGMT_ACL" }

  # ---------------------------------------------------------------------------
  # deploy_management_hardening.yaml
  # ---------------------------------------------------------------------------
  - { feature: hardening, state: present, line: "ip access-list standard HTTP_ACL" }
  - { feature: hardening, state: present, line: "ip http access-class ipv4 HTTP_ACL" }
  - { feature: hardening, state: present, line: "ip http active-session-modules none" }
  - { feature: hardening, state: present, line: "ip http secure-active-session-modules none" }
  - { feature: hardening, state: present, line: "ip ssh logging events" }
  - { feature: hardening, state: present, line: "ip ssh time-out {{ ssh_timeout }}" }
  - { feature: hardening, state: present, line: "ip ssh authentication-retries {{ ssh_auth_retries }}" }
  - { feature: hardening, state: present, line: "ip ssh rsa keypair-name {{ ssh_rsa_key_label }}" }
  - { feature: hardening, state: present, line: "ip ssh server algorithm kex ecdh-sha2-nistp521 ecdh-sha2-nistp384" }
  - { feature: hardening, state: present, line: "ip ssh server algorithm encryption aes256-gcm aes256-ctr" }
  - { feature: hardening, state: present, line: "ip ssh server algorithm mac hmac-sha2-512 hmac-sha2-256" }
  - { feature: hardening, state: absent,  line: "ip http server" }
  - { feature: hardening, state: absent,  line: "ip http secure-server" }

  # ---------------------------------------------------------------------------
  # deploy_dns_domain_name.yaml
  # ---------------------------------------------------------------------------
  - { feature: dns, state: present, line: "no ip domain lookup" }
  - { feature: dns, state: present, line: "ip domain name {{ domain_name }}" }
  - { feature: dns, state: present, line: "ip name-server {{ dns_server_ip_1 }} {{ dns_server_ip_2 }}" }

  # ---------------------------------------------------------------------------
  # deploy_ntp.yaml
  # ---------------------------------------------------------------------------
  - { feature: ntp, state: present, line: "ip access-list standard NTP_ACL" }
  - { feature: ntp, state: present, line: "ntp access-group peer NTP_ACL" }
  - { feature: ntp, state: present, line: "ntp source {{ ntp_source_interface_type }}{{ ntp_source_interface_number }}" }
  - { feature: ntp, state: present, line: "ntp authenticate" }
  - { feature: ntp, state: present, line: "ntp trusted-key 1" }

  # ---------------------------------------------------------------------------
  # deploy_logging.yaml
  # ---------------------------------------------------------------------------
  - { feature: logging, state: present, line: "no logging console" }
  - { feature: logging, state: present, line: "no logging monitor" }
  - { feature: logging, state: present, line: "logging buffered {{ logging_buffer_size }} warnings" }
  - { feature: logging, state: present, line: "logging trap {{ logging_trap_level }}" }
  - { feature: logging, state: present, line: "logging history informational" }
  - { feature: logging, state: present, line: "logging snmp-authfail" }
  - { feature: logging, state: present, line: "logging source-interface {{ logging_source_interface }}" }

  # ---------------------------------------------------------------------------
  # deploy_snmpv3.yaml
  # The SNMPv3 user does not appear in running-config at all - verify it
  # separately with "show snmp user".
  # ---------------------------------------------------------------------------
  - { feature: snmp, state: present, line: "ip access-list standard SNMP_ACL" }
  - { feature: snmp, state: present, line: "snmp-server group {{ snmp_group_name }} v3 priv access SNMP_ACL" }
  - { feature: snmp, state: present, line: "snmp-server location {{ snmp_location }}" }
  - { feature: snmp, state: present, line: "snmp-server trap-source {{ snmp_trap_source_type }}{{ snmp_trap_source_number }}" }
  - { feature: snmp, state: present, line: "snmp-server host {{ snmp_host_ip }} version 3 priv {{ snmp_user_name }}" }
  - { feature: snmp, state: present, line: "snmp-server enable traps cpu threshold" }
  - { feature: snmp, state: present, line: "snmp ifmib ifindex persist" }
  - { feature: snmp, state: present, line: "snmp mib flash cache" }
  - { feature: snmp, state: present, line: "process cpu threshold type total rising {{ cpu_rising_threshold }} interval {{ cpu_rising_interval }} falling {{ cpu_falling_threshold }} interval {{ cpu_falling_interval }}" }
  - { feature: snmp, state: present, line: "process cpu statistics limit entry-percentage {{ cpu_stats_entry_percentage }} size {{ cpu_stats_size }}" }

  # ---------------------------------------------------------------------------
  # deploy_config_archive.yaml
  # ---------------------------------------------------------------------------
  - { feature: archive, state: present, line: "archive" }
  - { feature: archive, state: present, section: "archive", line: "log config" }
  - { feature: archive, state: present, section: "archive", line: "logging enable" }
  - { feature: archive, state: present, section: "archive", line: "logging size 5" }
  - { feature: archive, state: present, section: "archive", line: "notify syslog contenttype plaintext" }
  - { feature: archive, state: present, section: "archive", line: "hidekeys" }
  - { feature: archive, state: present, section: "archive", line: "path {{ archive_path }}" }
  - { feature: archive, state: present, section: "archive", line: "maximum 10" }
  - { feature: archive, state: present, section: "archive", line: "time-period 1440" }
  - { feature: archive, state: present, section: "archive", line: "write-memory" }
  - { feature: archive, state: present, line: "kron occurrence one-month at 11:59 1 recurring" }
  - { feature: archive, state: present, line: "kron occurrence Backup at 12:00 1 recurring" }
  - { feature: archive, state: present, line: "kron policy-list save" }
  - { feature: archive, state: present, line: "kron policy-list CONFIGURATION_BACKUP" }
  - { feature: archive, state: present, section: "kron policy-list save", line: "cli write" }
  - { feature: archive, state: present, section: "kron policy-list CONFIGURATION_BACKUP", line: "cli archive config" }

  # ---------------------------------------------------------------------------
  # deploy_vtp.yaml
  # ---------------------------------------------------------------------------
  - { feature: vtp, state: present, line: "vtp mode transparent" }
  - { feature: vtp, state: present, line: "vtp domain {{ vtp_domain_name }}" }

  # ---------------------------------------------------------------------------
  # deploy_dhcp_snooping.yaml
  # ---------------------------------------------------------------------------
  - { feature: dhcp_snooping, state: present, line: "ip dhcp snooping" }
  - { feature: dhcp_snooping, state: present, line: "ip dhcp snooping vlan {{ dhcp_snooping_vlans }}" }
  - { feature: dhcp_snooping, state: present, line: "no ip dhcp snooping information option" }

  # ---------------------------------------------------------------------------
  # device_tracking.yaml
  # ---------------------------------------------------------------------------
  - { feature: tracking, state: present, line: "device-tracking tracking auto-source" }
  - { feature: tracking, state: present, line: "device-tracking policy IPDT_POLICY" }
  - { feature: tracking, state: present, line: "device-sensor filter-list cdp list CDP_LIST" }
  - { feature: tracking, state: present, line: "device-sensor filter-list lldp list LLDP_LIST" }
  - { feature: tracking, state: present, line: "device-sensor filter-list dhcp list DHCP_LIST" }
  - { feature: tracking, state: present, line: "device-sensor filter-spec cdp include list CDP_LIST" }
  - { feature: tracking, state: present, line: "device-sensor filter-spec lldp include list LLDP_LIST" }
  - { feature: tracking, state: present, line: "device-sensor filter-spec dhcp include list DHCP_LIST" }
  - { feature: tracking, state: present, line: "device-sensor accounting" }
  - { feature: tracking, state: present, line: "device-sensor notify all-changes" }
  - { feature: tracking, state: present, line: "cdp run" }
  - { feature: tracking, state: present, line: "lldp run" }
  - { feature: tracking, state: present, line: "errdisable recovery cause all" }
  - { feature: tracking, state: present, line: "errdisable recovery interval {{ errdisable_recovery_interval }}" }

  # ---------------------------------------------------------------------------
  # deploy_interface_templates_no_dot1x.yaml
  # Checks the templates exist. Per-port assignment is checked separately.
  # ---------------------------------------------------------------------------
  - { feature: templates, state: present, line: "template TRUNK_UPLINK" }
  - { feature: templates, state: present, line: "template TRUNK_FLEX_AP" }
  - { feature: templates, state: present, line: "template ACCESS_PORT" }
  - { feature: templates, state: present, section: "template TRUNK_UPLINK", line: "spanning-tree guard loop" }

  # ---------------------------------------------------------------------------
  # deploy_tacacs.yaml
  # ---------------------------------------------------------------------------
  - { feature: tacacs, state: present, line: "aaa group server tacacs+ {{ tacacs_group_name }}" }
  - { feature: tacacs, state: present, line: "ip tacacs source-interface {{ tacacs_source_interface_type }}{{ tacacs_source_interface_number }}" }
  - { feature: tacacs, state: present, line: "aaa authentication login {{ tacacs_authen_list }} group {{ tacacs_group_name }} local" }
  - { feature: tacacs, state: present, line: "aaa authorization exec {{ tacacs_author_list }} group {{ tacacs_group_name }} local if-authenticated" }
  - { feature: tacacs, state: present, line: "aaa authorization commands 7 {{ tacacs_cmds_list }} group {{ tacacs_group_name }} local if-authenticated" }
  - { feature: tacacs, state: present, line: "aaa authorization commands 15 {{ tacacs_cmds_list }} group {{ tacacs_group_name }} local if-authenticated" }
  - { feature: tacacs, state: present, line: "aaa accounting exec default start-stop group {{ tacacs_group_name }}" }
  - { feature: tacacs, state: present, line: "aaa accounting commands 7 default start-stop group {{ tacacs_group_name }}" }
  - { feature: tacacs, state: present, line: "aaa accounting commands 15 default start-stop group {{ tacacs_group_name }}" }
  - { feature: tacacs, state: present, section: "tacacs server", line: "single-connection" }
