---
- name: Test cli_parse
  hosts: all
  gather_facts: false
  vars:
    ansible_connection: network_cli
    ansible_port: 22

  tasks:
    - name: Parse show version
      ansible.utils.cli_parse:
        command: show version
        parser:
          name: ansible.netcommon.pyats
      register: showver

    - name: Show the parsed structure
      debug:
        var: showver.parsed
